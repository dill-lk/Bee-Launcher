[package]
name = "blockline-launcher"
version = "0.1.25"
description = "A lightweight local Minecraft Java launcher"
authors = ["Bee Launcher"]
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "blockline_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
base64 = "0.22"
png = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "webpki-roots"] }
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
